name: Wedstrijden ophalen

# Rekensom (Pro-plan: 7.500 calls per dag, 300 per minuut):
#   live:    elke 5 min van 09:00 tot 22:55 UTC = 168 runs × max. 1 call (alleen als er iets bezig is
#            of binnen 15 min begint; anders 0)                                                  = max. 168
#   seizoen: elke 3 uur (:22) × ±101 calls (hele seizoen van alle competities)                   = ±  808
#   standen: alleen competities met een gespeelde wedstrijd in de laatste ±6 uur (API-Football werkt
#            de stand soms laat bij); op een drukke zaterdag ±4 runs × ±100, doordeweeks weinig  = ±0–400
#   details: opstellingen en doelpunten van gespeelde wedstrijden, 20 per call; op een drukke
#            zaterdag ±20, doordeweeks een paar (het begin van het seizoen: eenmalig ±500)        = ±0–60
#   totaal                                                                                        = ±1.000–1.450
# Het script stopt als API-Football minder dan 1.500 over meldt (dat telt ook stadions.py mee), en na
# 400 calls in één run.
on:
  schedule:
    - cron: "*/5 9-22 * * *"
    - cron: "22 */3 * * *"
  workflow_dispatch:
    inputs:
      modus:
        description: "alles = hele seizoen ophalen (±101 calls, plus standen); live = alleen vandaag (1 call); herbouw = niets ophalen, alleen opnieuw neerzetten (0 calls)"
        default: alles
        type: choice
        options: [alles, live, herbouw]

permissions:
  contents: write   # details/ (opstellingen en doelpunten) terugzetten in de repo
  pages: write
  id-token: write

# Nooit twee runs tegelijk (dan zouden ze elkaars website overschrijven)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  ophalen:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - id: fetch
        name: Wedstrijden ophalen bij API-Football
        run: python3 scripts/haal_wedstrijden.py
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          MODE: ${{ github.event.schedule == '*/5 9-22 * * *' && 'live' || (github.event.schedule && 'seizoen' || inputs.modus || 'alles') }}

      # Opstellingen en doelpunten staan in de repo (details/), zodat een run ze niet van de site hoeft te halen
      - if: steps.fetch.outputs.details_changed == 'true'
        name: Opstellingen en doelpunten bewaren
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add details
          git commit -q -m "Opstellingen en doelpunten bijgewerkt"
          git pull -q --rebase
          git push -q

      - if: steps.fetch.outputs.changed == 'true'
        uses: actions/configure-pages@v6

      - if: steps.fetch.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - if: steps.fetch.outputs.changed == 'true'
        id: deploy
        uses: actions/deploy-pages@v5
