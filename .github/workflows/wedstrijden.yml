name: Wedstrijden ophalen

# Rekensom (Pro-plan: 7.500 calls per dag, 300 per minuut):
#   live:    elke 5 min van 09:00 tot 22:55 UTC = 168 runs × max. 1 call (alleen als er iets bezig is
#            of binnen 15 min begint; anders 0)                                                  = max. 168
#   seizoen: elke 3 uur (:22) × ±39 calls (hele seizoen van alle 38 competities)                 = ±  312
#   totaal                                                                                        = ±  480
# Het script stopt hard bij 2.500 calls per dag, of als API-Football minder dan 1.500 over meldt.
on:
  schedule:
    - cron: "*/5 9-22 * * *"
    - cron: "22 */3 * * *"
  workflow_dispatch:
    inputs:
      modus:
        description: "alles = hele seizoen ophalen (±39 calls); live = alleen vandaag (1 call); herbouw = niets ophalen, alleen opnieuw neerzetten (0 calls)"
        default: alles
        type: choice
        options: [alles, live, herbouw]

permissions:
  contents: read
  pages: write
  id-token: write

# Nooit twee runs tegelijk (dan zouden ze elkaars website overschrijven)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  ophalen:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - id: fetch
        name: Wedstrijden ophalen bij API-Football
        run: python3 scripts/haal_wedstrijden.py
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          MODE: ${{ github.event.schedule == '*/5 9-22 * * *' && 'live' || (github.event.schedule && 'seizoen' || inputs.modus || 'alles') }}

      - if: steps.fetch.outputs.changed == 'true'
        uses: actions/configure-pages@v6

      - if: steps.fetch.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - if: steps.fetch.outputs.changed == 'true'
        id: deploy
        uses: actions/deploy-pages@v5
