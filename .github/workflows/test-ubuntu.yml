name: Test op nieuwe Ubuntu (tijdelijk)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: cat /etc/os-release | head -2 && python3 --version
      - name: Script draaien zonder API-calls
        run: python3 scripts/haal_wedstrijden.py && ls -R site | head -20
        env:
          MODE: herbouw
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
