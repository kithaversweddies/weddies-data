<script>
(function(){

  var page = "privacy-en.html";
  for (var i = 0; i < langs.length; i++) {
    var l = String(langs[i]).toLowerCase().slice(0, 2);
    if (l === "nl") { page = "privacy-nl.html"; break; }
    if (l === "de") { page = "privacy-de.html"; break; }
    if (l === "en") { break; }
  }
  location.replace(page);
})();
</script>
